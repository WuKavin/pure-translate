<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>纯译 <span>PureTranslate</span></h1>
    <button id="open-options" title="设置">⚙</button>
  </header>

  <div id="status" class="status">…</div>

  <button id="toggle" class="primary">翻译当前页面</button>

  <div class="mode-group" id="mode-group">
    <button data-mode="bilingual">双语对照</button>
    <button data-mode="mono">单语译文</button>
  </div>

  <div class="row">
    <label for="target-lang">目标语言</label>
    <select id="target-lang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁体中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
      <option value="pt">Português</option>
    </select>
  </div>

  <div id="hint" class="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
